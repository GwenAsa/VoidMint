########################################
# VOIDMINT COMPOSITOR
# VOIDMINT - PICOM 13
########################################

# Safe rendering backend
backend = "xrender";
vsync = false;
use-damage = true;

# Subtle window shadows
shadow = false;
shadow-radius = 8;
shadow-opacity = 0.32;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-color = "#0B120D";

# No expensive background blur
detect-rounded-corners = true;

# ======================================
# WINDOW ANIMATIONS
# ======================================

animations = (
    {
        triggers = [ "open" ];
        preset = "appear";
        scale = 0.96;
        duration = 0.18;
    },

    {
        triggers = [ "close" ];
        preset = "disappear";
        scale = 0.96;
        duration = 0.15;
    },

    {
        triggers = [ "show" ];
        preset = "appear";
        scale = 0.98;
        duration = 0.16;
    },

    {
        triggers = [ "hide" ];
        preset = "disappear";
        scale = 0.98;
        duration = 0.14;
    },

    {
        # Experimental: smooth window movement and resizing
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.20;
    }
);

# Keep panels and desktop shadows clean
rules = (
    {
        match = "window_type = 'dock' || window_type = 'desktop'";
        shadow = false;
        corner-radius = 0;
    }
);
